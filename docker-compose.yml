# Shared env for the PHP containers (app + queue + scheduler). Kept in one place so
# none of them can drift onto a different DB/mail/API config than the others.
x-app-env: &app-env
  TMDB_API_KEY: ${TMDB_API_KEY}
  DONATE_BTC_ADDRESS: ${DONATE_BTC_ADDRESS:-}
  APP_URL: ${APP_URL}
  APP_NAME: ${APP_NAME}
  APP_VERSION: ${APP_VERSION:-1.0.0}
  APP_ENV: ${APP_ENV}
  APP_KEY: ${APP_KEY}
  APP_DEBUG: ${APP_DEBUG}
  LOG_CHANNEL: ${LOG_CHANNEL}
  LOG_STACK: ${LOG_STACK}
  LOG_LEVEL: ${LOG_LEVEL}
  DB_CONNECTION: mariadb
  DB_HOST: tv-tracker-db
  DB_PORT: 3306
  SESSION_DRIVER: database
  QUEUE_CONNECTION: database
  CACHE_STORE: database
  DB_DATABASE: ${DB_DATABASE}
  DB_USERNAME: ${DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD}
  MAIL_MAILER: ${MAIL_MAILER:-log}
  MAIL_HOST: ${MAIL_HOST:-smtp-relay.brevo.com}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
  MAIL_USERNAME: ${MAIL_USERNAME}
  MAIL_PASSWORD: ${MAIL_PASSWORD}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  TRUSTED_PROXIES: ${TRUSTED_PROXIES}

# Shared service definition for the three PHP containers. They run the same image
# off the same source mount and differ only in what they execute.
x-app-service: &app-service
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  volumes:
    - ./src:/var/www/html
  environment:
    <<: *app-env
  restart: always
  networks:
    - laravel

# queue + scheduler: the app image running something other than php-fpm.
# Both run as www-data (not the container-default root) so any files they
# write under storage/ stay writable by the php-fpm workers, which are also
# www-data. And both wait on app's completion marker themselves: depends_on
# only gates startup order for `docker compose up` — after a host reboot Docker
# restarts every container independently, so they can start before app's
# entrypoint has chowned storage/ or run migrate. The service's `command` is
# what runs once it's there.
x-worker-service: &worker-service
  <<: *app-service
  depends_on:
    app:
      condition: service_healthy
  user: www-data
  entrypoint:
    - sh
    - -c
    - |
      until [ -f storage/framework/migrated ]; do
        echo "waiting for app migration to finish..."
        sleep 2
      done
      exec "$$@"
    - worker

services:
  app:
    <<: *app-service
    depends_on:
      db:
        condition: service_healthy
    container_name: tv-tracker-app
    healthcheck:
      # Flips healthy only once entrypoint.sh has finished composer install
      # + migrate, so queue/scheduler (which depend on this) don't start
      # hitting tables that don't exist yet.
      test: ["CMD", "test", "-f", "/var/www/html/storage/framework/migrated"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  # Runs the daily episode-check + notification dispatch on Laravel's scheduler
  # so it keeps firing without depending on a host crontab.
  scheduler:
    <<: *worker-service
    container_name: tv-tracker-scheduler
    command: ["php", "artisan", "schedule:work"]

  # Processes queued jobs (TMDB sync, notification sends) off the request
  # cycle so external API calls never block a user's page load.
  queue:
    <<: *worker-service
    container_name: tv-tracker-queue
    # --max-time bounds how long one worker process runs before Laravel
    # restarts it — without it, a worker started before a code deploy (this
    # volume is a live bind mount of ./src) keeps serving the old code
    # indefinitely instead of picking up the new build on its next job.
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]

  nginx:
    image: nginx:alpine
    container_name: tv-tracker-nginx
    restart: always
    ports:
      - "8085:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laravel

  db:
    image: mariadb:11.8
    container_name: tv-tracker-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - ./db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - laravel

networks:
  laravel:
    driver: bridge
