server {
    listen 80;
    index index.php index.html;
    server_name localhost;
    root /var/www/html/public;

    # Docker's embedded DNS server. Re-resolving `app` per-request (via the
    # $upstream_app variable below) instead of caching a static fastcgi_pass
    # target means nginx picks up the new container IP whenever `app` gets
    # recreated on deploy, instead of holding a 502-inducing stale IP until
    # nginx itself is restarted.
    resolver 127.0.0.11 valid=10s;

    # The base image ships with gzip commented out. The Vite bundles compress
    # to roughly a third of their size, on every cold page load.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Vite writes content-hashed filenames here, so a given URL's bytes never
    # change — cache them hard instead of revalidating each asset per page view.
    location /build/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location ~ \.php$ {
        # Without this, a request for a .php path that doesn't exist on disk
        # (e.g. /uploads/whatever.jpg/x.php) still gets forwarded to php-fpm,
        # which — combined with cgi.fix_pathinfo (see zz-app.ini) — is the
        # classic PATH_INFO misconfiguration that turns an uploaded non-PHP
        # file into executable code. This app has no upload endpoint today,
        # but the nginx-level guard costs nothing and closes the gap outright.
        try_files $uri =404;

        set $upstream_app app:9000;
        fastcgi_pass $upstream_app;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
