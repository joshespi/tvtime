memory_limit = 1G

; Paired with nginx's `try_files $uri =404` (see docker/nginx/default.conf):
; the default of 1 lets PHP walk a request path backwards to find a file that
; does exist when the literal path doesn't, which is the mechanism behind the
; classic PATH_INFO code-execution misconfiguration. Off is the safe default
; for a normal app that doesn't rely on PATH_INFO-style URLs (this one doesn't).
cgi.fix_pathinfo = 0
