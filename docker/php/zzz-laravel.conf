[www]
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on

; The stock pool caps concurrency at 5 workers. Catalog search makes a blocking
; outbound call during page render, so a slow provider would otherwise tie up
; most of the app's request capacity.
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
